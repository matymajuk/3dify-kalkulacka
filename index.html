<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3Dify.cz – Kalkulačka 3D tisku</title>
<style>
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --panel2: #f7f7f7;
  --orange: #ff7518;
  --text: #202124;
  --muted: #666666;
  --line: #e5e5e5;
*{box-sizing:border-box}
body {
  margin: 0;
  background: #ffffff;
  color: #202124;
  font: 16px/1.5 system-ui, sans-serif;
  padding: 32px 16px;
}
.wrap{max-width:760px;margin:auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--orange);display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px}
.brand{font-weight:850;font-size:24px;letter-spacing:-.7px}.brand span{color:var(--orange)}
.kicker{color:var(--orange);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
h1{font-size:clamp(30px,6vw,46px);line-height:1.08;letter-spacing:-1.4px;margin:8px 0 10px}
.lead{color:var(--muted);margin:0 0 26px}
.card {
  background: #ffffff;
  border: 1px solid #e5e5e5;
  border-radius: 20px;
  padding: clamp(20px, 4vw, 32px);
  box-shadow: 0 8px 30px #0000000a;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:flex;flex-direction:column;gap:8px}
label{font-weight:700;font-size:14px}
input, select {
  background: #f7f7f7;
  color: #202124;
  border: 1px solid #dddddd;
}
input:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff751822}
small{color:var(--muted);font-size:12px}
.result {
  background: #fff7f0;
  border: 1px solid #ffdabf;
}
.result-top{color:var(--muted);font-size:12px;letter-spacing:1.5px;font-weight:800}
.price{font-size:clamp(38px,8vw,54px);font-weight:900;letter-spacing:-1.8px;color:var(--orange);margin:3px 0}
.breakdown{color:var(--muted);font-size:13px}
button{margin-top:18px;width:100%;border:0;border-radius:12px;padding:15px;background:var(--orange);color:white;font:800 15px inherit;cursor:pointer}
button:hover{filter:brightness(1.08)}
.note{font-size:12px;color:var(--muted);margin:16px 2px 0}
@media(max-width:560px){body{padding:22px 12px}.grid{grid-template-columns:1fr}.card{padding:19px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">3D</div><div class="brand">3Dify<span>.cz</span></div></header>

<h1>Spočítej si cenu 3D tisku</h1>
<p class="lead">Zadej parametry svého modelu a zjisti orientační cenu zakázky.</p>
<section class="card" aria-label="Kalkulačka ceny 3D tisku">
<div class="grid">
<div class="field"><label for="material">Materiál</label><select id="material"><option value="2.2">PLA – univerzální</option><option value="2.6">PETG – odolnější</option><option value="3.0">ABS – technický</option></select><small>Cena materiálu se započítává podle hmotnosti.</small></div>
<div class="field"><label for="weight">Hmotnost modelu (g)</label><input id="weight" type="number" min="1" max="10000" value="50"></div>
<div class="field"><label for="quality">Kvalita tisku</label><select id="quality"><option value="1">Standardní</option><option value="1.25">Vysoká</option><option value="1.5">Prémiová</option></select></div>
<div class="field"><label for="infill">Výplň modelu</label><select id="infill"><option value="0.8">20 % – lehká</option><option value="1">40 % – běžná</option><option value="1.2">60 % – pevnější</option><option value="1.4">80 % – velmi pevná</option><option value="1.6">100 % – plná</option></select></div>
<div class="field"><label for="quantity">Počet kusů</label><input id="quantity" type="number" min="1" max="500" value="1"></div>
</div>
<div class="result" aria-live="polite">

<div class="price" id="price">125 Kč</div>
<div class="breakdown" id="breakdown">Cena za 1 kus: 125 Kč</div>
</div>
<button type="button" id="request">Poptat tento tisk</button>
<p class="note">Výpočet je pouze orientační. Konečná cena se může lišit podle složitosti modelu, času tisku, podpěr a přípravy zakázky.</p>
</section>
</div>
<script>
const ids=['material','weight','quality','infill','quantity'];
const els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
const priceEl=document.getElementById('price'), breakdownEl=document.getElementById('breakdown');
const money=n=>new Intl.NumberFormat('cs-CZ',{style:'currency',currency:'CZK',maximumFractionDigits:0}).format(n);
function calculate(){
 const material=Number(els.material.value), weight=Math.max(1,Number(els.weight.value)||1);
 const quality=Number(els.quality.value), infill=Number(els.infill.value), quantity=Math.max(1,Math.floor(Number(els.quantity.value)||1));
 const perPiece=Math.max(65,(weight*material*quality*infill)+45);
 const total=perPiece*quantity;
 priceEl.textContent=money(total);
 breakdownEl.textContent=`Cena za 1 kus: ${money(perPiece)} · Počet kusů: ${quantity}`;
}
ids.forEach(id=>els[id].addEventListener('input',calculate));
document.getElementById('request').addEventListener('click',()=>{
 const summary=`Poptávka 3D tisku – 3Dify.cz\nMateriál: ${els.material.options[els.material.selectedIndex].text}\nHmotnost: ${els.weight.value} g\nKvalita: ${els.quality.options[els.quality.selectedIndex].text}\nVýplň: ${els.infill.options[els.infill.selectedIndex].text}\nPočet kusů: ${els.quantity.value}\nOrientační cena: ${priceEl.textContent}`;
 if(navigator.clipboard && navigator.clipboard.writeText){
  navigator.clipboard.writeText(summary).then(()=>alert('Parametry kalkulace byly zkopírovány. Vlož je do poptávkového formuláře na webu.')).catch(()=>alert(summary));
 }else alert(summary);
});
calculate();
</script>
</body>
</html>
